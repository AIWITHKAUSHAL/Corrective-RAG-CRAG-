[project]
name = "corrective-rag-lab"
version = "1.0.0"
description = "An inspectable LangGraph Corrective RAG agent powered by EURI"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langgraph>=1.0,<2",
  "openai>=2.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
